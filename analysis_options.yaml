include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/gen/**"
    - "widgetbook/**"
    - build/**
    - android/**

linter:
  rules:
    # Documentar cada miembro público es excesivo para una app.
    public_member_api_docs: false
