    body {

  </head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen relative antialiased selection:bg-primary-container selection:text-on-primary-container"><main class="flex flex-col relative w-full pt-safe pb-safe bg-surface min-h-screen"><div class="flex flex-col w-full px-margin pb-space-lg select-none relative overflow-hidden">
<!-- Barra superior con acción Saltar -->
<div class="flex items-center justify-between pt-space-md pb-space-sm w-full">
<div class="flex items-center gap-space-xs">
<div class="w-2.5 h-2.5 rounded-full bg-secondary shadow-[0_0_12px_rgba(65,222,183,0.5)]"></div>
<span class="font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Enfoque</span>
</div>
<button class="font-label-lg text-label-lg text-on-surface-variant hover:text-on-surface transition-colors px-space-xs py-1 rounded-full active:opacity-70 focus:outline-none" id="skip-btn" type="button">
      Saltar
    </button>
</div>
<!-- Contenedor del Carrusel / Vista activa -->
<div class="relative w-full flex flex-col items-center mt-space-sm">
<!-- Efecto de resplandor ambiental suave -->
<div class="absolute -top-10 w-72 h-72 bg-primary-container/20 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="absolute top-28 w-56 h-56 bg-secondary/10 rounded-full blur-2xl pointer-events-none -z-10"></div>
<!-- Ilustración vectorial minimalista: celular sereno + brote floreciendo -->
<div class="relative w-full max-w-[280px] aspect-square flex items-center justify-center my-space-sm">
<svg class="w-full h-full drop-shadow-[0_16px_32px_rgba(19,19,27,0.8)]" fill="none" viewbox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialgradient cx="0" cy="0" gradienttransform="translate(160 160) scale(140)" gradientunits="userSpaceOnUse" id="indigoAura" r="1">
<stop offset="0%" stop-color="#5B5BD6" stop-opacity="0.35"></stop>
<stop offset="65%" stop-color="#5B5BD6" stop-opacity="0.08"></stop>
<stop offset="100%" stop-color="#13131B" stop-opacity="0"></stop>
</radialgradient>
<lineargradient gradientunits="userSpaceOnUse" id="bubbleStroke" x1="60" x2="260" y1="40" y2="280">
<stop offset="0%" stop-color="#C1C1FF" stop-opacity="0.4"></stop>
<stop offset="100%" stop-color="#41DEB7" stop-opacity="0.15"></stop>
</lineargradient>
<lineargradient gradientunits="userSpaceOnUse" id="phoneBody" x1="110" x2="210" y1="80" y2="250">
<stop offset="0%" stop-color="#292932"></stop>
<stop offset="100%" stop-color="#1B1B23"></stop>
</lineargradient>
<lineargradient id="leafGrad" x1="0" x2="1" y1="0" y2="1">
<stop offset="0%" stop-color="#65FBD2"></stop>
<stop offset="100%" stop-color="#00C19C"></stop>
</lineargradient>
</defs>
<!-- Aura de serenidad -->
<circle cx="160" cy="160" fill="url(#indigoAura)" r="130"></circle>
<!-- Burbuja protectora de calma -->
<circle cx="160" cy="160" opacity="0.8" r="118" stroke="url(#bubbleStroke)" stroke-dasharray="6 4" stroke-width="1.5"></circle>
<circle cx="160" cy="160" fill="#1F1F27" fill-opacity="0.6" r="102"></circle>
<!-- Ondas zen concéntricas discretas -->
<circle cx="160" cy="160" opacity="0.35" r="82" stroke="#464553" stroke-width="1"></circle>
<!-- Dispositivo móvil en calma -->
<rect fill="url(#phoneBody)" height="162" rx="20" stroke="#464553" stroke-width="1.5" width="90" x="115" y="75"></rect>
<rect fill="#0D0D15" height="138" rx="14" width="74" x="123" y="87"></rect>
<!-- Pantalla del celular con modo no molestar apacible -->
<rect fill="#34343D" height="4" rx="2" width="36" x="142" y="93"></rect>
<circle cx="160" cy="122" fill="#5B5BD6" fill-opacity="0.25" r="14"></circle>
<path d="M156 122L159 125L165 119" stroke="#C1C1FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<!-- Íconos de distracción bloqueados / en reposo -->
<circle cx="138" cy="198" fill="#34343D" r="6"></circle>
<circle cx="160" cy="198" fill="#34343D" r="6"></circle>
<circle cx="182" cy="198" fill="#34343D" r="6"></circle>
<!-- Tallo de crecimiento orgánico brotando desde el centro -->
<path d="M160 180 C160 162 154 150 160 138" stroke="#41DEB7" stroke-linecap="round" stroke-width="3"></path>
<!-- Hoja Izquierda Verde Menta -->
<path d="M159 152 C145 150 136 139 140 131 C149 133 158 142 159 152 Z" fill="url(#leafGrad)"></path>
<!-- Hoja Derecha Verde Menta -->
<path d="M160 144 C175 142 184 131 180 123 C171 125 162 134 160 144 Z" fill="url(#leafGrad)"></path>
<!-- Mini brote superior iluminado -->
<circle cx="160" cy="135" fill="#65FBD2" r="3.5"></circle>
<!-- Partículas de foco flotantes -->
<circle cx="94" cy="116" fill="#C1C1FF" opacity="0.75" r="2.5"></circle>
<circle cx="228" cy="108" fill="#41DEB7" opacity="0.8" r="2"></circle>
<circle cx="236" cy="192" fill="#C1C1FF" opacity="0.6" r="3"></circle>
<circle cx="86" cy="204" fill="#41DEB7" opacity="0.5" r="1.5"></circle>
</svg>
</div>
<!-- Textos de la diapositiva 1 -->
<div class="w-full text-center px-space-sm mt-space-xs transition-opacity duration-300" id="slide-text-container">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high mb-space-sm">
<span class="material-symbols-outlined text-secondary" style="font-size: 14px; font-variation-settings: 'FILL' 1;">lock_open_right</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Modo Zen Activo</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight mb-space-xs" id="slide-title">
        Estudia sin distracciones
      </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto leading-relaxed" id="slide-desc">
        Enfoque bloquea las apps que te distraen mientras estudias.
      </p>
</div>
<!-- Mini vista previa / chips sutiles de próximas diapositivas -->
<div class="w-full flex items-center justify-center gap-space-xs mt-space-md px-space-xs">
<!-- Chip Diapositiva 2 Preview -->
<button class="group flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container hover:bg-surface-container-high transition-all max-w-[155px] text-left" onclick="goToSlide(1)" type="button">
<span class="material-symbols-outlined text-primary text-[16px] group-hover:scale-110 transition-transform">group</span>
<span class="font-label-sm text-label-sm text-on-surface-variant truncate">Estudia con tus amigos</span>
</button>
<!-- Chip Diapositiva 3 Preview -->
<button class="group flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface-container hover:bg-surface-container-high transition-all max-w-[155px] text-left" onclick="goToSlide(2)" type="button">
<span class="material-symbols-outlined text-tertiary text-[16px] group-hover:scale-110 transition-transform">event_repeat</span>
<span class="font-label-sm text-label-sm text-on-surface-variant truncate">Tu semana organizada</span>
</button>
</div>
</div>
<!-- Controles inferiores: Paginación & Botón Primario -->
<div class="w-full flex flex-col items-center gap-space-lg mt-space-xl">
<!-- Indicador de 3 puntos (Paginación Material 3) -->
<div aria-label="Progreso de bienvenida" class="flex items-center justify-center gap-2" role="tablist">
<div class="h-2 w-7 rounded-full bg-primary-container transition-all duration-300" id="dot-0"></div>
<div class="h-2 w-2 rounded-full bg-surface-container-highest transition-all duration-300" id="dot-1"></div>
<div class="h-2 w-2 rounded-full bg-surface-container-highest transition-all duration-300" id="dot-2"></div>
</div>
<!-- Botón Primario: Siguiente (52px de altura, pill redondeado) -->
<button class="w-full h-[52px] rounded-full bg-primary-container hover:bg-[#4E4EC9] active:scale-[0.98] text-on-primary-container font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-[0_8px_20px_rgba(91,91,214,0.35)] transition-all cursor-pointer" id="next-btn" type="button">
<span>Siguiente</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  (function() {
    const slides = [
      {
        title: "Estudia sin distracciones",
        desc: "Enfoque bloquea las apps que te distraen mientras estudias.",
        badgeIcon: "lock_open_right",
        badgeText: "Modo Zen Activo",
        buttonText: "Siguiente"
      },
      {
        title: "Estudia con tus amigos",
        desc: "Únete a salas silenciosas en tiempo real y alcancen metas juntos.",
        badgeIcon: "group",
        badgeText: "Salas Silenciosas",
        buttonText: "Siguiente"
      },
      {
        title: "Tu semana, organizada sola",
        desc: "Algoritmos inteligentes adaptan tus repasos según tu nivel de energía.",
        badgeIcon: "auto_awesome",
        badgeText: "Planificación Viva",
        buttonText: "Comenzar ahora"
      }
    ];

    let currentIdx = 0;
    const titleEl = document.getElementById("slide-title");
    const descEl = document.getElementById("slide-desc");
    const containerEl = document.getElementById("slide-text-container");
    const nextBtn = document.getElementById("next-btn");
    const skipBtn = document.getElementById("skip-btn");

    function updateDots(index) {
      for (let i = 0; i < 3; i++) {
        const dot = document.getElementById(`dot-${i}`);
        if (!dot) continue;
        if (i === index) {
          dot.className = "h-2 w-7 rounded-full bg-primary-container transition-all duration-300";
        } else {
          dot.className = "h-2 w-2 rounded-full bg-surface-container-highest transition-all duration-300";
        }
      }
    }

    window.goToSlide = function(index) {
      if (index < 0 || index >= slides.length) return;
      currentIdx = index;
      containerEl.style.opacity = "0.3";
      
      setTimeout(() => {
        titleEl.textContent = slides[currentIdx].title;
        descEl.textContent = slides[currentIdx].desc;
        nextBtn.querySelector("span:first-child").textContent = slides[currentIdx].buttonText;
        updateDots(currentIdx);
        containerEl.style.opacity = "1";
      }, 150);
    };

    nextBtn.addEventListener("click", () => {
      if (currentIdx < slides.length - 1) {
        goToSlide(currentIdx + 1);
      } else {
        nextBtn.classList.add("scale-95");
        setTimeout(() => {
          nextBtn.classList.remove("scale-95");
          window.location.hash = "#inicio";
        }, 120);
      }
    });

    skipBtn.addEventListener("click", () => {
      goToSlide(slides.length - 1);
    });
  })();
</script></main></body></html>
